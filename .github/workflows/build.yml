name: Build ZMK Firmware

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    strategy:
      matrix:
        include:
          - shield: lily58_left
            filename: lily58_left
            role_central: n
          - shield: lily58_right
            filename: lily58_right
            role_central: n
          - shield: lily58
            filename: lily58_central
            role_central: y
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ZMK
        run: |
          west init -l .
          west update
          west zephyr-export

      - name: Build ${{ matrix.filename }}
        run: |
          west build -s app -b nice_nano_v2 -- \
            -DSHIELD=${{ matrix.shield }} \
            -DZMK_CONFIG="$(pwd)/config" \
            -DCONFIG_ZMK_SPLIT=y \
            -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=${{ matrix.role_central }}
          mv app/build/zephyr/zmk.uf2 ${{ matrix.filename }}.uf2

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.filename }}.uf2
          retention-days: 30